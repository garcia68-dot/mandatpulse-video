name: Render MandatPulse video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Render MP4
        run: npm run render
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: mandatpulse-video
          path: out/mandatpulse.mp4
          retention-days: 30
