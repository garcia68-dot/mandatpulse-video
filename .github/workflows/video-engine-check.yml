name: Validate LighAura video engine

on:
  push:
    branches:
      - video-engine-wan22
    paths:
      - 'video_engine/**'
      - '.github/workflows/video-engine-check.yml'
  pull_request:
    paths:
      - 'video_engine/**'
      - '.github/workflows/video-engine-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python orchestrator
        run: |
          python -m py_compile video_engine/wan22_clip.py video_engine/orchestrate.py
      - name: Validate preset JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('video_engine/presets/lighaura_hero.json')
          data = json.loads(p.read_text())
          assert data['task'] in {'ti2v-5B','i2v-A14B'}
          assert len(data['shots']) >= 1
          for shot in data['shots']:
              frames = int(shot.get('frames', 121))
              assert frames > 0 and (frames - 1) % 4 == 0
              assert shot['prompt'].strip()
          print('preset OK')
      - name: Verify CLI help
        run: |
          python video_engine/wan22_clip.py --help >/dev/null
          python video_engine/orchestrate.py --help >/dev/null
