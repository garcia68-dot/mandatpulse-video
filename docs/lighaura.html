<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LighAuraMG — Storyboard</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#25292d,#090a0c 58%,#020203);font-family:Inter,system-ui,sans-serif;color:#fff}
    main{width:min(1200px,94vw);padding:32px 0 50px}
    .eyebrow{font:700 12px/1 ui-monospace,monospace;letter-spacing:.28em;color:#c8a05a}
    h1{margin:12px 0 10px;font-size:clamp(34px,6vw,72px);letter-spacing:-.055em;line-height:.95;font-weight:600}
    p{margin:0 0 28px;color:#aeb4ba;max-width:780px;line-height:1.6}
    .frame{overflow:hidden;border:1px solid #ffffff1f;border-radius:18px;background:#000;box-shadow:0 34px 90px #0009,0 0 0 1px #c8a05a24}
    video{display:block;width:100%;aspect-ratio:16/9;background:#000}
    .meta{display:flex;justify-content:space-between;gap:20px;margin-top:18px;color:#858b91;font:600 11px/1.4 ui-monospace,monospace;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">LIGHTAURA MG · HERO SCROLL STORY</div>
    <h1>Storyboard cinématique</h1>
    <p>Révélation, assemblage du casque, rotation produit et transition vers la collection. La vidéo est pensée pour être pilotée par le scroll du site.</p>
    <div class="frame">
      <video src="./lighaura-story.mp4" controls autoplay muted loop playsinline></video>
    </div>
    <div class="meta"><span>16:9 · 1920×1080 · H.264</span><span>24 s · Remotion</span></div>
  </main>
</body>
</html>
